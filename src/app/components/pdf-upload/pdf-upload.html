<!-- <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar> -->
<!-- loader overlay & above progress bar commenting and using this instead -->
<div *ngIf="isLoading" class="loader-overlay">
    <mat-spinner [diameter]="60" strokeWidth="5"></mat-spinner>
    <p class="loader-text">Uploading PDF...</p>
</div>
<!-- pdf upload main container -->
<div class="pdf-upload-main-container">
    <div class="upload-wrapper" *ngIf="!pdfUploaded">
        <div class="upload-hero">
            <header class="upload-hero-header">
                <p class="upload-hero-eyebrow">PDF Extracter</p>
                <!-- <h1 class="upload-hero-title">Upload a document</h1> -->
                <p class="upload-hero-subtitle">Drop a PDF below or browse your files. After upload you can read the
                    document and ask questions in chat.</p>
            </header>

            <div class="upload-dropzone" [class.upload-dropzone--active]="isDragOver"
                (click)="fileInput.click()" (dragenter)="onDragEnter($event)"
                (dragleave)="onDragLeave($event)" (dragover)="onDragOver($event)" (drop)="onDrop($event)">

                <p class="upload-hint-corner">Drag + drop your PDF here</p>

                <div class="upload-content">
                    <div class="upload-icon-bg" aria-hidden="true">
                        <mat-icon class="upload-icon">upload</mat-icon>
                    </div>

                    <p class="upload-text-main">Click to upload, or drag PDF here</p>
                    <p class="upload-text-hint">PDF files only</p>
                    <button type="button" class="upload-btn" (click)="$event.stopPropagation(); fileInput.click();">
                        <mat-icon aria-hidden="true">upload</mat-icon>
                        <span>Upload PDF</span>
                    </button>
                    <input type="file" #fileInput (change)="onFileSelected($event)" accept="application/pdf" hidden>
                </div>
            </div>
        </div>
    </div>

    <!-- chat & pdf viewer container -->
    <div class="chat-pdf-viewer-container" *ngIf="pdfUploaded">
        <div class="pdf-viewer-section">
            <div class="pdf-header">
                <div class="pdf-header-left">
                    <mat-icon>description</mat-icon>
                    <span class="pdf-filename">{{ fileNameToDisplay }}</span>
                </div>
                <button mat-icon-button (click)="restart()" matTooltip="Reset & Upload another PDF"
                    matTooltipPosition="below">
                    <mat-icon>restart_alt</mat-icon>
                </button>
            </div>
            <!-- pdf viewer -->
            <div class="pdf-viewer">
                <app-view-pdf [pdfSrc]="pdfSrc"></app-view-pdf>
            </div>
        </div>
        <!-- chat -->
        <div class="chat-section">
            <app-chat [filename]="uploadedFilename" [summary]="summary"
                [suggestedQuestions]="suggestedQuestions"></app-chat>
        </div>
    </div>
</div>
